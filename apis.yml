aid: bloomthis
name: BloomThis
description: >-
  BloomThis is a Malaysian online florist and gifting brand (backed by 500 Global) offering
  fresh flower boxes, hand-tied bouquets, and weekly fresh-flower subscriptions, with a free
  personalised card and photo on every order and free same-day delivery across Kuala Lumpur,
  Selangor, Kedah, Penang, Negeri Sembilan, and Johor Bahru. Its Shopify storefront natively
  exposes an agent-commerce surface via the Universal Commerce Protocol (UCP): a hosted MCP
  endpoint at /api/ucp/mcp, an OpenID Connect / OAuth Customer Account API, and published
  /llms.txt and /agents.md instructions that let AI shopping agents search the catalog, build a
  cart, and run a buyer-approved checkout.
